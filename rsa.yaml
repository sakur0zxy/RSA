literature_root: "01_literature"
templates_root: "templates"
profiles:
  root: "topic_profiles"
rounds:
  default_max_candidates: 5
  hard_max_candidates: 20
  allowed_tools: []
  output_policy: "agent_outputs_only"
  approval_mode: "human_confirmed_formal_writes"
  campaign_id:
reading_draft:
  llm:
    provider:
    model:
    api_key_env:
    base_url:
    timeout_seconds: 60
    max_chunks: 8
    max_input_tokens: 12000
    temperature: 0
    language: "zh"
    prompt_profile: "default"
    codex_oauth:
      auth_store: ".rsa/auth/codex_oauth.yaml"
      codex_home:
      token_source: "rsa_store"
      refresh_command:
      base_url: "https://chatgpt.com/backend-api/codex"
      response_endpoint:
  review:
    ready_score_threshold: 6
discovery:
  default_provider: "openalex"
  default_max_queries: 3
  default_max_results: 5
  allowed_providers:
    - "openalex"
    - "crossref"
    - "offline"
  automation_mode: "monitored_auto"
dynamic_workflow:
  default_policy: "templates/dynamic_workflow_policy.yaml"
  automation_mode: "monitored_auto"
  min_confidence_to_run: "medium"
  allow_llm_suggestions: false
