[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsa-research-agent"
version = "0.1.0"
description = "面向可审计文献调研流程的本地优先科研 agent harness。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
browser = [
  "playwright>=1.48",
]

[project.scripts]
rsa = "rsa_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rsa_cli = ["data/topic_profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
